name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Dirvexa.slnx
      - name: Build
        run: dotnet build Dirvexa.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Dirvexa.slnx -c Release --no-build
      - name: Audit dependencies
        shell: pwsh
        run: |
          $output = dotnet list Dirvexa.slnx package --vulnerable --include-transitive
          $output
          if ($output -match 'has the following vulnerable packages') { throw 'Vulnerable dependency detected.' }
      - name: Cross-publish portable binaries
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -Version 0.1.0-ci -SkipTests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable-ci
          path: artifacts/windows/Dirvexa-*-portable.exe*
          if-no-files-found: error
