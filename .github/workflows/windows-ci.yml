name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Dirvexa.slnx
      - name: Build
        run: dotnet build Dirvexa.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Dirvexa.slnx -c Release --no-build
      - name: Audit dependencies
        shell: pwsh
        run: |
          $output = dotnet list Dirvexa.slnx package --vulnerable --include-transitive
          $output
          if ($output -match 'has the following vulnerable packages') { throw 'Vulnerable dependency detected.' }
      - name: Cross-publish portable binaries
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Dirvexa.App/Dirvexa.App.csproj -Raw
          ./scripts/Build-Windows.ps1 -Version ([string]$project.Project.PropertyGroup.Version) -SkipTests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable-ci
          path: |
            artifacts/windows/Portable/Dirvexa-*-portable.exe
            artifacts/windows/Checksums/Dirvexa-*-portable.exe.sha256
          if-no-files-found: error
