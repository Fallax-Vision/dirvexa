name: Feature request
description: Suggest an offline, read-only improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What problem should Dirvexa solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Privacy boundary
      options:
        - label: This can remain offline and read-only.
          required: true
